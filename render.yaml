# Despliegue en Render (plan gratuito). Se crea desde el panel: New > Blueprint > este repositorio.
# Las URL públicas salen del nombre de cada servicio: https://<nombre>.onrender.com

databases:
  - name: clinica-veterinaria-itm-db
    plan: free
    region: oregon
    postgresMajorVersion: "17"
    databaseName: clinica
    user: clinica

services:
  # Servidor de aplicación: API FastAPI + programador de tareas.
  - type: web
    name: clinica-veterinaria-itm-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/salud
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clinica-veterinaria-itm-db
          property: connectionString
      - key: JWT_SECRETO
        generateValue: true
      - key: CORS_ORIGENES
        value: https://clinica-veterinaria-itm.onrender.com
      - key: URL_FRONTEND
        value: https://clinica-veterinaria-itm.onrender.com
      - key: CORREO_API_URL
        value: https://clinica-veterinaria-itm-correo.onrender.com
      - key: CORREO_API_AUTH
        fromService:
          type: web
          name: clinica-veterinaria-itm-correo
          envVarKey: MP_UI_AUTH
      - key: MODO_DEMO
        value: "true"

  # Servicio de correo de pruebas: bandeja web donde se ven los correos enviados.
  - type: web
    name: clinica-veterinaria-itm-correo
    runtime: image
    plan: free
    region: oregon
    image:
      url: docker.io/axllent/mailpit:v1.33
    envVars:
      - key: MP_UI_BIND_ADDR
        value: 0.0.0.0:10000
      # El SMTP no se usa en Render (el correo entra por la API HTTP): solo escucha en local.
      - key: MP_SMTP_BIND_ADDR
        value: 127.0.0.1:1025
      # Usuario y clave de la bandeja ("usuario:clave"). Render la pide al crear el Blueprint.
      - key: MP_UI_AUTH
        sync: false

  # Servidor web: archivos estáticos de Angular servidos por la CDN de Render.
  - type: web
    name: clinica-veterinaria-itm
    runtime: static
    buildCommand: >-
      cd frontend
      && npx --yes pnpm@11.28.2 install --frozen-lockfile
      && sed -i "s#http://localhost:8000/api#$API_URL#" src/environments/environment.ts
      && npx --yes pnpm@11.28.2 run build
    staticPublishPath: ./frontend/dist/frontend/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_URL
        value: https://clinica-veterinaria-itm-api.onrender.com/api
      - key: NODE_VERSION
        value: "24"
